spring.profiles.active=dev

spring.application.name=movieverse

spring.datasource.driver-class-name=org.postgresql.Driver

server.port=8081
server.servlet.context-path=/movieverse/api

# Spring AI
# La key real se inyecta por variable de entorno (launch.json o terminal).
# "demo" es solo el valor por defecto para que la app arranque sin key.
spring.ai.openai.api-key=${OPENAI_API_KEY:demo}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.7

# Para OpenCode Go define en el entorno:
#   OPENAI_BASE_URL=https://opencode.ai/inference/go/openai
#   OPENAI_MODEL=deepseek-v4.1-flash